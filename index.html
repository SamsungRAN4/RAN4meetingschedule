    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
        .grid-schedule {
            display: grid;
            grid-template-columns: 120px repeat(4, minmax(240px, 1fr));
            gap: 1px;
            background-color: #d1d5db;
        }
        .lowlight { font-style: italic; opacity: 0.75; font-weight: 400; }
        .tab-active { border-bottom: 2px solid #2563eb; color: #1d4ed8; font-weight: 600; background-color: white; }
        .tab-inactive { color: #6b7280; font-weight: 500; }
        .tab-inactive:hover { color: #374151; background-color: #f3f4f6; }
        .break-row { grid-column: span 5; }
        .gray-out { background-color: #f3f4f6; color: #9ca3af; }
        .gray-out .text-gray-900 { color: #6b7280; }
        .collision-badge { background-color: #fef2f2; border: 1px solid #ef4444; color: #b91c1c; }
    </style>
</head>

    function preprocessScheduleData() {
        scheduleData.forEach(day => {
            let processedDay = { day: day.day, slots: [] };
            day.slots.forEach((slot, sIdx) => {
                let processedSlot = { time: slot.time, isBreak: slot.isBreak, text: slot.text, rooms: [] };
                
                if (!slot.isBreak) {
                    slot.r.forEach((cellText, rIdx) => {
                        let roomObj = { text: cellText, topics: [], owners: [], hasOwner: false };
                        const isAdministrative = /TBD|EARLY RETURN TO|Return to|Main session/i.test(cellText) || !cellText.trim();
                        
                        if (!isAdministrative) {
                            let matches = [...cellText.matchAll(/\[(\d+[A-Z-]*)\]/g)].map(m => m[1]);
                            let cellOwnersSet = new Set();
                            
                            if (matches.length > 0) {
                                roomObj.topics = matches;
                                matches.forEach(t => {
                                    if (topicOwners[t]) topicOwners[t].forEach(o => cellOwnersSet.add(o));
                                });
                            } else {
                                // Inheritance Logic
                                let inheritedFrom = getPreviousNonBreakRoom(processedDay.slots, rIdx);
                                if (inheritedFrom && inheritedFrom.hasOwner) {
                                    roomObj.topics = inheritedFrom.topics;
                                    inheritedFrom.owners.forEach(o => cellOwnersSet.add(o));
                                    roomObj.isInherited = true;
                                }
                            }
                            roomObj.owners = Array.from(cellOwnersSet);
                            roomObj.hasOwner = roomObj.owners.length > 0;
                            
                            roomObj.owners.forEach(o => {
                                let baseName = o.split(' ')[0];
                                if(baseName !== "Hongjun") {
                                    delegatesSet.add(baseName);
                                } else if (o.includes("Home Support")) {
                                    delegatesSet.add(baseName); // Keep Hongjun in the filter
                                }
                            }); 
                        }
                        processedSlot.rooms.push(roomObj);
                    });
                }
                processedDay.slots.push(processedSlot);
            });
            allParsedData.push(processedDay);
        });
    }

    function getPreviousNonBreakRoom(slots, rIdx) {
        for (let i = slots.length - 1; i >= 0; i--) {
            if (!slots[i].isBreak && slots[i].rooms[rIdx]) {
                return slots[i].rooms[rIdx];
            }
        }
        return null;
    }

    function buildUI() {
        const filterSelect = document.getElementById('userFilter');
        Array.from(delegatesSet).sort().forEach(user => {
            let option = document.createElement('option');
            option.value = user;
            option.textContent = user;
            filterSelect.appendChild(option);
        });

        const tabsContainer = document.getElementById('tabs');
        allParsedData.forEach((data, index) => {
            let btn = document.createElement('button');
            btn.className = `px-6 py-3 cursor-pointer transition-colors ${index === 0 ? 'tab-active' : 'tab-inactive'}`;
            btn.textContent = data.day;
            btn.onclick = () => {
                document.querySelectorAll('#tabs button').forEach(b => { b.classList.remove('tab-active'); b.classList.add('tab-inactive'); });
                btn.classList.add('tab-active');
                btn.classList.remove('tab-inactive');
                currentDayIndex = index;
                renderSchedule();
            };
            tabsContainer.appendChild(btn);
        });
    }

    function renderSchedule() {
        const grid = document.getElementById('gridContainer');
        const selectedUser = document.getElementById('userFilter').value;
        const currentData = allParsedData[currentDayIndex];
        
        grid.innerHTML = `
            <div class="bg-gray-800 text-white font-semibold p-3 text-center text-sm sticky top-0 z-10">Time</div>
            <div class="bg-gray-800 text-white font-semibold p-3 text-center text-sm sticky top-0 z-10 border-l border-gray-700">Main (Yang)</div>
            <div class="bg-gray-800 text-white font-semibold p-3 text-center text-sm sticky top-0 z-10 border-l border-gray-700">BR1 (Shan)</div>
            <div class="bg-gray-800 text-white font-semibold p-3 text-center text-sm sticky top-0 z-10 border-l border-gray-700">BR2 (Gene)</div>
            <div class="bg-gray-800 text-white font-semibold p-3 text-center text-sm sticky top-0 z-10 border-l border-gray-700">Ad Hoc</div>
        `;

        currentData.slots.forEach(slot => {
            if (slot.isBreak) {
                grid.innerHTML += `
                    <div class="break-row bg-gray-200 text-gray-500 font-medium py-3 text-center border-y border-gray-300 shadow-inner flex items-center justify-center tracking-wide text-sm">
                        ${slot.text}
                    </div>`;
            } else {
                let timeCell = `<div class="bg-white p-3 border-r border-gray-200 flex items-center justify-center text-sm font-semibold text-gray-700 shadow-sm">${slot.time}</div>`;
                grid.innerHTML += timeCell;

                let userOccurrences = {};
                slot.rooms.forEach(room => {
                    room.owners.forEach(owner => {
                        let baseName = owner.split(' ')[0];
                        userOccurrences[baseName] = (userOccurrences[baseName] || 0) + 1;
                    });
                });

                slot.rooms.forEach((room, rIdx) => {
                    if (!room.text.trim()) {
                        grid.innerHTML += `<div class="bg-white p-2"></div>`;
                        return;
                    }

                    const isGrayedOut = !room.hasOwner;
                    const baseColorClass = isGrayedOut ? 'gray-out' : roomColors[rIdx % 4];
                    let formattedText = room.text.replace(/\n/g, '<br/>');
                    let cellContent = `<div class="h-full flex flex-col gap-2 p-3 ${baseColorClass} border border-transparent rounded shadow-sm text-sm">`;
                    
                    cellContent += `<div class="flex-1 font-medium text-gray-900 leading-relaxed">${formattedText}</div>`;

                    if (!isGrayedOut) {
                        cellContent += `<div class="flex flex-wrap gap-1 mt-2 pt-2 border-t border-black/10">`;
                        room.owners.forEach(owner => {
                            let baseName = owner.split(' ')[0];
                            let isMonitoring = owner.includes("(monitoring)");
                            let styleClass = isMonitoring ? "lowlight" : "";
                            let isCollision = selectedUser === "All" ? userOccurrences[baseName] > 1 : (baseName === selectedUser && userOccurrences[baseName] > 1);
                            
                            let bgClass = isCollision ? "collision-badge" : "bg-white text-gray-800 border border-gray-300";
                            let icon = isCollision ? "⚠️" : "👤";
                            
                            if(selectedUser !== "All" && baseName !== selectedUser) {
                                styleClass += " opacity-40";
                                bgClass = "bg-transparent border-transparent text-gray-500";
                                icon = "";
                            }

                            cellContent += `<span class="inline-flex items-center gap-1 px-2 py-0.5 rounded text-xs ${bgClass} ${styleClass}">
                                ${icon} ${owner.replace('(monitoring)', '').trim()} ${isMonitoring ? '(mon)' : ''}
                            </span>`;
                        });
                        cellContent += `</div>`;
                    }
                    cellContent += `</div>`;
                    grid.innerHTML += `<div class="p-1.5 bg-white border-l border-gray-200">${cellContent}</div>`;
                });
            }
        });
    }

    preprocessScheduleData();
    buildUI();
    renderSchedule();
</script>
</body>
</html>
