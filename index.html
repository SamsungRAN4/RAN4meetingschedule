        :root {

        /* Strict CSS Grid Architecture */
        .schedule-grid {
            display: grid;
            grid-template-columns: var(--col-time) repeat(4, minmax(220px, 1fr));
            gap: 12px;
            align-items: stretch;
        }
        .break-row {
            grid-column: 1 / -1;
            background-color: #f3f4f6;
            border-left: 5px solid #9ca3af;
            color: #6b7280;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 16px;
            border-radius: 8px;
        }
        .room-yang { border-left: 5px solid #3b82f6; background-color: #eff6ff; }
        .room-shan { border-left: 5px solid #10b981; background-color: #ecfdf5; }
        .room-gene { border-left: 5px solid #8b5cf6; background-color: #f5f3ff; }
        .room-adhoc { border-left: 5px solid #f59e0b; background-color: #fffbeb; }
        .unowned-cell { border: 1px dashed #d1d5db; background-color: #f9fafb; color: #9ca3af; }
        
        .collision-card { border: 2px solid #ef4444 !important; background-color: #fef2f2 !important; position: relative; }
        .collision-indicator { font-size: 10px; color: #b91c1c; font-weight: bold; background: #fee2e2; padding: 2px 6px; border-radius: 4px; margin-top: 6px; display: inline-block; border: 1px solid #f87171; }
        
        .owner-badge { font-size: 11px; padding: 3px 8px; border-radius: 9999px; background: white; border: 1px solid #e5e7eb; display: inline-flex; align-items: center; gap: 4px; box-shadow: 0 1px 2px rgba(0,0,0,0.05); font-weight: bold; color: #374151; }
        .monitoring { opacity: 0.65; font-style: italic; font-weight: normal; }
        
        /* Ensures cards stretch to fill row height */
        .flex-card { height: 100%; display: flex; flex-direction: column; gap: 8px; flex: 1; }
    </style>
</head>

        let currentDay = "Monday";

        function initTabs() {
            const container = document.getElementById('dayTabs');
            container.innerHTML = Object.keys(scheduleData).map(day => `
                <button onclick="switchDay('${day}')" class="px-8 py-3 rounded-xl font-black text-sm uppercase transition-all tracking-widest ${currentDay === day ? 'bg-blue-600 text-white shadow-lg ring-4 ring-blue-100' : 'bg-white text-slate-400 hover:bg-slate-200 border border-slate-200'}">
                    ${day}
                </button>
            `).join('');
        }

        function switchDay(day) { 
            currentDay = day; 
            initTabs(); 
            renderSchedule(); 
        }

        function getOwnersForTopics(topics) {
            if (!topics || topics.length === 0) return [];
            let owners = [];
            topics.forEach(t => {
                const delegateList = DELEGATE_MAP[t] || [];
                owners.push(...delegateList);
            });
            return [...new Set(owners)];
        }

        function renderSchedule() {
            const container = document.getElementById('scheduleGrid');
            const data = scheduleData[currentDay];
            
            let html = `<div class="schedule-grid">
                <div class="text-[10px] font-black text-slate-300 uppercase p-2 flex items-end">Time</div>
                <div class="text-[10px] font-black text-blue-400 uppercase p-2 border-b-2 border-blue-400">Yang (Main)</div>
                <div class="text-[10px] font-black text-green-400 uppercase p-2 border-b-2 border-green-400">Shan (BR1)</div>
                <div class="text-[10px] font-black text-purple-400 uppercase p-2 border-b-2 border-purple-400">Gene (BR2)</div>
                <div class="text-[10px] font-black text-amber-400 uppercase p-2 border-b-2 border-amber-400">Ad-hoc</div>`;

            data.forEach((row, rowIndex) => {
                html += `<div class="p-3 border-t border-slate-100 flex items-center font-mono text-sm text-slate-400 font-bold bg-white">${row.time}</div>`;
                
                if (row.isBreak) {
                    html += `<div class="break-row my-2 shadow-inner">${row.text}</div>`;
                } else {
                    // Pre-calculate per-person collisions in this specific timeslot row
                    const delegateCount = {};
                    row.rooms.forEach(room => {
                        const uniqueRoomOwners = [...new Set(getOwnersForTopics(room.topics).map(o => o.replace(' (monitoring)', '')))];
                        uniqueRoomOwners.forEach(owner => {
                            delegateCount[owner] = (delegateCount[owner] || 0) + 1;
                        });
                    });

                    // Render 4 strict columns mapped correctly
                    for (let i = 0; i < 4; i++) {
                        const room = row.rooms[i];
                        if (room) {
                            const owners = getOwnersForTopics(room.topics);
                            const activeCollisions = owners.filter(o => delegateCount[o.replace(' (monitoring)', '')] > 1);
                            
                            const hasOwner = owners.length > 0;
                            const isFilteredOut = currentFilter !== "All" && !owners.some(o => o.includes(currentFilter));
                            
                            const opacityClass = isFilteredOut ? 'opacity-30 grayscale transition-all' : 'opacity-100 transition-all';
                            const baseClass = hasOwner ? `room-${room.name.toLowerCase().replace(' ', '')}` : 'unowned-cell';
                            const collisionClass = activeCollisions.length > 0 ? 'collision-card' : '';

                            html += `
                                <div class="p-4 rounded-xl shadow-sm flex-card ${baseClass} ${opacityClass} ${collisionClass}">
                                    <div class="text-[10px] font-black uppercase opacity-40 tracking-tighter mb-1">${room.name}</div>
                                    <div class="text-[13px] font-bold leading-snug text-slate-800 flex-grow">${room.text}</div>
                                    ${hasOwner ? `
                                        <div class="mt-4 flex flex-wrap gap-2 pt-3 border-t border-slate-900 border-opacity-5">
                                            ${owners.map(o => `<span class="owner-badge ${o.includes('monitoring') ? 'monitoring' : ''}">👤 ${o}</span>`).join('')}
                                        </div>
                                    ` : ''}
                                    ${activeCollisions.length > 0 ? `<div class="collision-indicator shadow-sm mt-3">⚠️ Colliding: ${activeCollisions.map(c => c.replace(' (monitoring)', '')).join(', ')}</div>` : ''}
                                </div>`;
                        } else {
                            html += `<div class="unowned-cell rounded-xl flex-card"></div>`;
                        }
                    }
                }
            });
            
            container.innerHTML = html + `</div>`;
        }

        document.getElementById('delegateFilter').addEventListener('change', (e) => {
            currentFilter = e.target.value;
            renderSchedule();
        });

        initTabs(); 
        renderSchedule();
    </script>
</body>
</html>
