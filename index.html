    let activeDay = "Monday";

    function parseTopics(text) {
        if (!text || text.trim() === "") return { delegates: [], isGray: true };
        
        // Don't assign owners to administrative blocks
        const adminBlocks = ["EARLY RETURN TO", "Ad-hoc or Early Return-to", "Return to", "Placeholder", "TBD", "13 Any", "1. Opening"];
        if (adminBlocks.some(word => text.includes(word))) return { delegates: [], isGray: true };

        let assignedDelegates = new Set();
        const regex = /\[(\d+(?:-[A-Z])?)\]/g;
        let match;
        let foundTopic = false;

        while ((match = regex.exec(text)) !== null) {
            foundTopic = true;
            const topicId = match[1];
            if (topicMap[topicId]) {
                topicMap[topicId].forEach(d => assignedDelegates.add(d));
            }
        }

        const delegates = Array.from(assignedDelegates);
        return {
            delegates: delegates,
            isGray: foundTopic && delegates.length === 0
        };
    }

    function renderTabs() {
        const tabsContainer = document.getElementById('tabs');
        tabsContainer.innerHTML = '';
        Object.keys(scheduleData).forEach(day => {
            const btn = document.createElement('button');
            btn.className = `flex-1 py-3 text-center font-bold transition-colors focus:outline-none whitespace-nowrap px-4 ${activeDay === day ? 'bg-white text-blue-800 border-b-4 border-blue-800 shadow-sm' : 'text-gray-600 hover:bg-gray-300 border-b-4 border-transparent'}`;
            btn.innerText = day;
            btn.onclick = () => { activeDay = day; renderSchedule(); renderTabs(); };
            tabsContainer.appendChild(btn);
        });
    }

    function renderSchedule() {
        const container = document.getElementById('schedule-container');
        container.innerHTML = '';
        const dayData = scheduleData[activeDay];
        const selectedDelegate = document.getElementById('delegateFilter').value;

        // Force exactly 4 columns
        const maxCols = 4; 
        
        const grid = document.createElement('div');
        grid.className = 'grid-schedule';
        grid.style.gridTemplateColumns = `120px repeat(${maxCols}, minmax(0, 1fr))`;

        // Header Row
        grid.innerHTML += `<div class="font-extrabold text-gray-500 text-center pb-2 border-b-2 border-gray-300 flex items-end justify-center uppercase tracking-wider text-xs">Time</div>`;
        for (let i = 0; i < maxCols; i++) {
            grid.innerHTML += `<div class="font-extrabold text-gray-700 text-center pb-2 border-b-2 border-gray-300 flex items-end justify-center uppercase tracking-wider text-xs">${roomNames[i]}</div>`;
        }

        dayData.forEach(row => {
            if (row.type === 'break') {
                grid.innerHTML += `
                    <div class="break-cell bg-gray-200/80 text-gray-600 font-bold text-center py-2 rounded-md shadow-inner my-1 flex items-center justify-center space-x-2 border border-gray-300 border-dashed">
                        <span class="text-lg">☕</span>
                        <span class="uppercase tracking-widest text-sm">${row.time} - ${row.text}</span>
                    </div>
                `;
            } else {
                // Determine collisions across row
                const rowDelegates = {};
                row.cells.forEach((cellText, colIndex) => {
                    const { delegates } = parseTopics(cellText);
                    delegates.forEach(d => {
                        const cleanName = d.split(' ')[0];
                        if (!rowDelegates[cleanName]) rowDelegates[cleanName] = [];
                        rowDelegates[cleanName].push(colIndex);
                    });
                });

                // Render Time Cell
                grid.innerHTML += `<div class="font-bold text-gray-700 flex items-center justify-center p-2 bg-white rounded shadow-sm border border-gray-200 tracking-tight text-center">${row.time}</div>`;
                
                // Render Room Cells
                row.cells.forEach((cellText, i) => {
                    if (cellText === "") {
                        grid.innerHTML += `<div class="bg-transparent border-2 border-dashed border-gray-200 rounded p-2 flex-1"></div>`;
                        return;
                    }

                    const { delegates, isGray } = parseTopics(cellText);
                    
                    let bgClass = "bg-white border-gray-200";
                    if (isGray) bgClass = "bg-gray-100 border-gray-300 text-gray-500";
                    else if (i === 0) bgClass = "bg-blue-50 border-blue-200 shadow-sm";
                    else if (i === 1) bgClass = "bg-green-50 border-green-200 shadow-sm";
                    else if (i === 2) bgClass = "bg-purple-50 border-purple-200 shadow-sm";
                    else if (i === 3) bgClass = "bg-orange-50 border-orange-200 shadow-sm";

                    // Apply filter logic
                    if (selectedDelegate !== "All" && delegates.length > 0) {
                        const hasSelected = delegates.some(d => d.includes(selectedDelegate));
                        if (!hasSelected) bgClass = "bg-gray-50 border-gray-200 opacity-40 grayscale shadow-none";
                    }

                    let contentHtml = `<div class="whitespace-pre-line text-xs font-semibold leading-relaxed mb-2">${cellText}</div>`;
                    
                    if (delegates.length > 0) {
                        contentHtml += `<div class="mt-auto border-t border-black/10 pt-2 flex flex-wrap gap-1.5">`;
                        delegates.forEach(d => {
                            const cleanName = d.split(' ')[0];
                            const isCollision = rowDelegates[cleanName] && rowDelegates[cleanName].length > 1;
                            const isMonitor = d.includes("monitoring");
                            
                            let styleClasses = "text-xs px-2 py-0.5 rounded border border-black/10 bg-white/70 text-gray-800 flex items-center gap-1 font-medium shadow-sm";
                            if (isCollision) styleClasses += " collision";
                            if (isMonitor) styleClasses += " lowlight bg-gray-100";
                            
                            contentHtml += `<span class="${styleClasses}">👤 ${d} ${isCollision ? '⚠️' : ''}</span>`;
                        });
                        contentHtml += `</div>`;
                    } else if (!isGray) {
                        contentHtml += `<div class="mt-auto border-t border-black/10 pt-2 text-xs font-medium italic text-gray-400">No Samsung owner mapped</div>`;
                    }

                    grid.innerHTML += `<div class="${bgClass} border rounded p-3 h-full flex flex-col gap-2 transition-all hover:shadow-md flex-1">${contentHtml}</div>`;
                });
            }
        });

        container.appendChild(grid);
    }

    document.getElementById('delegateFilter').addEventListener('change', renderSchedule);
    
    // Init
    renderTabs();
    renderSchedule();
</script>
</body>
</html>
