                { room: "Main", content: "6G RRM\n6G AI\n6G operation efficiency\n5GA R19 AI\n5GA spectrum and RF maintenance", topics: [] },
                { room: "BR1", content: "Return to\nOTA", topics: [] },
                { room: "BR2", content: "Return to", topics: [] },
                { room: "AdHoc", content: "", topics: [] }
            ]},
            { time: "12:45-13:45", type: "break", text: "Lunch break" },
            { time: "15:00-EOM", type: "regular", cols: [
                { room: "Main", content: "13 Any other business\n14 Close of the meeting", topics: [] },
                { room: "BR1", content: "Return to (final round)", topics: [] },
                { room: "BR2", content: "Return to (final round)", topics: [] },
                { room: "AdHoc", content: "", topics: [] }
            ]}
        ]
    };

    let activeDay = "Monday";

    const bgMap = {
        "Main": "bg-blue-50 border-blue-200",
        "BR1": "bg-green-50 border-green-200",
        "BR2": "bg-yellow-50 border-yellow-200",
        "AdHoc": "bg-purple-50 border-purple-200"
    };

    function extractDelegatesForTopics(topics) {
        let owners = new Set();
        topics.forEach(t => {
            if(topicDelegates[t]) {
                topicDelegates[t].forEach(owner => owners.add(owner));
            }
        });
        return Array.from(owners);
    }

    function renderTabs() {
        const tabsContainer = document.getElementById('dayTabs');
        tabsContainer.innerHTML = '';
        Object.keys(scheduleData).forEach(day => {
            const btn = document.createElement('button');
            btn.className = `px-4 py-2 text-sm font-medium rounded-t-lg border-b-2 transition-colors ${activeDay === day ? 'border-blue-600 text-blue-600 bg-blue-50' : 'border-transparent text-gray-500 hover:text-gray-700 hover:bg-gray-100'}`;
            btn.innerText = day;
            btn.onclick = () => { activeDay = day; renderTabs(); renderGrid(); };
            tabsContainer.appendChild(btn);
        });
    }

    function renderGrid() {
        const grid = document.getElementById('scheduleGrid');
        // Clear old rows, keep header (first 5 elements)
        while (grid.children.length > 5) {
            grid.removeChild(grid.lastChild);
        }

        const filterVal = document.getElementById('delegateFilter').value;
        const currentSlots = scheduleData[activeDay];

        currentSlots.forEach(slot => {
            // Render Time
            const timeDiv = document.createElement('div');
            timeDiv.className = "flex items-center justify-center p-3 text-sm font-semibold bg-gray-50 border-b border-gray-200 text-center";
            timeDiv.innerText = slot.time;
            grid.appendChild(timeDiv);

            if (slot.type === "break") {
                const breakDiv = document.createElement('div');
                breakDiv.className = "break-row bg-gray-200 text-gray-600 font-bold p-3 text-center border-b border-gray-300 flex items-center justify-center uppercase tracking-wide text-sm";
                breakDiv.innerText = slot.text;
                breakDiv.style.gridColumn = "2 / span 4";
                grid.appendChild(breakDiv);
                return; // skip rendering regular columns
            }

            // Find Collisions across rooms for this timeslot
            let allAssignedInSlot = [];
            slot.cols.forEach(col => {
                let owners = extractDelegatesForTopics(col.topics);
                // Strip tags for pure name collision tracking
                allAssignedInSlot = allAssignedInSlot.concat(owners.map(o => o.split(' (')[0])); 
            });
            const collisions = allAssignedInSlot.filter((item, index) => allAssignedInSlot.indexOf(item) !== index);

            slot.cols.forEach(col => {
                const cellDiv = document.createElement('div');
                cellDiv.className = "h-full flex flex-col gap-2 p-2 border-b border-r border-gray-200";
                
                if (!col.content.trim() || col.content === "TBD" || col.content.includes("EARLY RETURN TO") || col.content.includes("Return to") || col.content.includes("Placeholder")) {
                    // Empty or admin cell - inherit rule exception applied
                    cellDiv.classList.add("bg-gray-50");
                    if (col.content.trim()) {
                        const card = document.createElement('div');
                        card.className = "flex-1 p-3 rounded border border-gray-200 bg-gray-100 text-gray-400 text-sm font-medium flex items-center justify-center text-center";
                        card.innerText = col.content;
                        cellDiv.appendChild(card);
                    }
                    grid.appendChild(cellDiv);
                    return;
                }

                let owners = extractDelegatesForTopics(col.topics);
                
                const card = document.createElement('div');
                card.className = `flex-1 p-3 rounded border text-sm flex flex-col justify-between shadow-sm transition-opacity duration-200`;

                let isRelevantToFilter = false;
                if (filterVal === "All") isRelevantToFilter = true;
                else {
                    isRelevantToFilter = owners.some(o => o.includes(filterVal));
                }

                if (owners.length === 0) {
                    // No internal owner => strictly grayed out
                    card.classList.add("bg-gray-100", "border-gray-200", "text-gray-500");
                } else {
                    if (!isRelevantToFilter && filterVal !== "All") {
                        // Not the filtered user
                        card.classList.add("bg-gray-50", "border-gray-200", "opacity-40", "text-gray-400");
                    } else {
                        // Colored room based
                        card.classList.add(...bgMap[col.room].split(" "));
                    }
                }

                let innerHTML = `<div class="whitespace-pre-wrap mb-3 font-medium leading-relaxed">${col.content}</div>`;
                
                if (owners.length > 0) {
                    let ownerHTML = `<div class="mt-auto space-y-1.5 border-t border-black/5 pt-2">`;
                    owners.forEach(owner => {
                        let baseName = owner.split(' (')[0];
                        let isCollision = collisions.includes(baseName);
                        let isMonitored = owner.includes("monitoring");

                        let textStyle = isMonitored ? "italic opacity-70 font-normal" : "font-semibold";
                        let badgeHtml = "";

                        if (isCollision && (filterVal === "All" || filterVal === baseName)) {
                            badgeHtml = `<span class="ml-auto text-[10px] bg-red-500 text-white px-1.5 py-0.5 rounded shadow-sm uppercase tracking-wider font-bold">Collision</span>`;
                        }

                        ownerHTML += `
                            <div class="flex flex-wrap items-center text-xs text-gray-800 bg-white/70 rounded px-2 py-1.5 shadow-sm border border-black/10">
                                <span class="mr-1.5 text-blue-600">👤</span>
                                <span class="${textStyle}">${owner}</span>
                                ${badgeHtml}
                            </div>
                        `;
                    });
                    ownerHTML += `</div>`;
                    innerHTML += ownerHTML;
                }

                card.innerHTML = innerHTML;
                cellDiv.appendChild(card);
                grid.appendChild(cellDiv);
            });
        });
    }

    document.getElementById('delegateFilter').addEventListener('change', renderGrid);

    // Initial render setup
    renderTabs();
    renderGrid();

</script>
</body>
</html>
